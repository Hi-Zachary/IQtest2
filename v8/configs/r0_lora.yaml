# R0 (v8): Frozen CLIP ViT-B/16 + Visual Q/K LoRA (strong reference)
# 调整/改进1.md 第 10/17 节: R0 = B0 + LoRA, 验证 backbone adaptation
model:
  arch: "msqr_dgmpq_hcmi_v8"
  model_name: "ckpt/clip-vit-base-patch16"
  context_length: 77
  output_dim: 2

  freeze_visual: True
  freeze_text: True

  dropout_rate: 0.1
  dim: 256
  num_heads: 4
  mlp_ratio: 1.0
  outer_gate_init: 0.01
  lora_lr_scale: 1.0
  module_lr_scale: 1.0

  use_lora: True
  lora_r: 4
  lora_alpha: 8
  lora_dropout: 0.0
  use_dg_mpq: False
  use_hcmi: False

dataset:
  data_path: "data/aigc_qa_3k/mos_joint.xlsx"
  vis_root: "data/aigc_qa_3k/AGIQA-3K/"
  transform_train:
    name: "image_train_processor"
    cfg:
      image_size: 224
  transform_val:
    name: "image_eval_processor"
    cfg:
      image_size: 224

run:
  task: "agiqa_doublescore"
  resume_ckpt_path: null

  lr_sched: "linear_warmup_cosine_lr"
  lr_decay_rate: null
  warmup_lr: 0
  warmup_steps: 50
  min_lr: 1e-6

  init_lr: 1e-4
  lr_layer_decay: 1
  weight_decay: 0
  beta2: 0.999

  batch_size: 64
  batch_size_val: 64
  num_worker: 12

  max_epoch: 50
  log_freq: 20
  accum_grad_iters: 1
  grad_norm_clip: null

  split_file: "splits/seed42_split3.json"
  output_dir: "run"
  best_criterion: "joint"
  tag: "R0_lora"

  evaluate: False
  eval_freq: 1
  save_freq: 5

  amp: True
  device: "cuda"
  distributed: False
  dist_url: "env://"
