# B2_shcmi (AGIQA-3K, split3): use_msqr=False use_shcmi=True use_taf=False
# 改进1.md v2: Frozen CLIP + residual branches, init_lr 1e-4, 无 head_scale
model:
  arch: "msqr_shcmi"
  base_ckpt: data/ckpt/clip/openai/resnet/RN50.pt
  input_resolution: 512
  output_dim: 2

  freeze_visual: True
  freeze_text: True
  module_lr_scale: 1.0
  head_scale: null

  dropout_rate: 0.1
  dim: 256
  num_heads: 4
  mlp_ratio: 2.0
  gamma_init: 0.0
  internal_gate_init: 0.01

  use_msqr: False
  use_shcmi: True
  use_deviation: False
  use_prompt_weight: False
  use_align_bias: False

dataset:
  data_path: "data/aigc_qa_3k/mos_joint.xlsx"
  vis_root: "data/aigc_qa_3k/AGIQA-3K/"
  transform_train:
    name: "image_train_processor"
    cfg:
      image_size: 512
  transform_val:
    name: "image_eval_processor"
    cfg:
      image_size: 512

run:
  task: "agiqa_doublescore"
  resume_ckpt_path: null

  lr_sched: "linear_warmup_cosine_lr"
  lr_decay_rate: null
  warmup_lr: 0
  warmup_steps: 50
  min_lr: 1e-6

  init_lr: 1e-4
  lr_layer_decay: 1
  weight_decay: 0
  beta2: 0.999

  batch_size: 64
  batch_size_val: 64
  num_worker: 12

  max_epoch: 30
  log_freq: 20
  accum_grad_iters: 1
  grad_norm_clip: null

  split_file: "splits/seed42_split3.json"
  output_dir: "run"
  best_criterion: "joint"
  consistency_weight: 0
  tag: "B2_shcmi"

  evaluate: False
  eval_freq: 1
  save_freq: 5

  amp: True
  device: "cuda"
  distributed: False
  dist_url: "env://"
